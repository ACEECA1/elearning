<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter View - UniLearn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../index.css">
    <link rel="stylesheet" href="chapter.css">
    <link rel="stylesheet" href="discussion.css">
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <a href="../../../index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
                <span>UniLearn</span>
            </a>
            <div class="nav-actions">
                <div class="user-profile" id="userProfile" style="cursor:pointer;">
                    <div class="user-avatar" id="userAvatar"><span>-</span></div>
                    <div class="user-info">
                        <div class="user-name" id="userName">Loading...</div>
                        <div class="user-role" id="userRole">...</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="main-layout">
        
        <aside class="sidebar" id="sidebar">
            <nav class="sidebar-nav">
                <ul class="sidebar-menu">
                    <li class="sidebar-item"><a href="../student-dashboard/student-dashboard.html" class="sidebar-link"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
                    <li class="sidebar-item"><a href="../courses/courses.html" class="sidebar-link active"><i class="fas fa-book"></i><span>My Courses</span></a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <div class="content-wrapper">
                
                <div class="chapter-header">
                    <h1 class="chapter-title" id="chapterTitle">Loading...</h1>
                    <p class="chapter-subtitle" id="chapterSubtitle">Please wait...</p>
                </div>

                <div class="video-container" id="videoContainer" style="display: none;">
                    <div class="video-player">
                        <div id="videoFrame"></div>
                    </div>
                </div>
                <div id="chapterContent" style="display:none; background:#fff; padding:2rem; margin-top:2rem; border-radius:10px;"></div>

                <div class="materials-section">
                    <h3 class="materials-title">Course Materials</h3>
                    <div id="materialsList"><p style="color:#888;">Loading materials...</p></div>
                </div>

                <div class="tabs-container">
                    <div class="tabs-header">
                        <button class="tab-btn active" data-tab="discussion">
                            <i class="far fa-comments"></i> Discussion
                        </button>
                        <button class="tab-btn" data-tab="quiz">
                            <i class="fas fa-clipboard-list"></i> Quiz
                        </button>
                    </div>

                    <div id="discussion" class="tab-content active">
                        <div class="discussion-section">
                            <div class="comment-input-wrapper">
                                <div class="user-avatar-small" id="commentUserAvatar">Me</div>
                                <div class="input-box">
                                    <textarea id="commentInput" placeholder="Add to the discussion..."></textarea>
                                    <button id="sendCommentBtn" class="send-comment-btn"><i class="fas fa-paper-plane"></i> Post</button>
                                </div>
                            </div>
                            <div class="comments-list" id="commentsList">
                                <div style="text-align:center; padding:2rem;"><i class="fas fa-spinner fa-spin"></i> Loading comments...</div>
                            </div>
                        </div>
                    </div>

                    <div id="quiz" class="tab-content">
                        <div id="quizContainer">
                            <p style="text-align:center; color:#666;">Checking for quizzes...</p>
                        </div>
                    </div>
                </div>

                <footer class="footer">
                    <div class="footer-bottom">
                        <p>© 2025 UniLearn University. All rights reserved.</p>
                    </div>
                </footer>

            </div>
        </main>

    </div>

    <button class="mobile-sidebar-toggle" id="mobileSidebarToggle"><i class="fas fa-bars"></i></button>

    <script type="module" src="chapter.js"></script>
</body>
</html>

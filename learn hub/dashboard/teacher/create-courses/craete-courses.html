<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course - UniLearn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../index.css">
    <link rel="stylesheet" href="create-courses.css">
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <a href="../../../index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
                <span>UniLearn</span>
            </a>
            <button class="notification-btn">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" style="display: none;">0</span>
            </button>
            <div class="nav-actions">
                <div class="user-profile" id="userProfile" style="cursor: pointer;">
                    <div class="user-info-header">
                        <div class="user-name-header" id="userName">Loading...</div>
                        <div class="user-role-header" id="userRole">Teacher</div>
                    </div>
                    <div class="user-avatar" id="userAvatar"><span>-</span></div>
                </div>
            </div>
        </div>
    </header>

    <div class="main-layout">
        
        <aside class="sidebar" id="sidebar">
            <nav class="sidebar-nav">
                <ul class="sidebar-menu">
                    <li class="sidebar-item">
                        <a href="../teacher-dashboard/teacher-dashboard.html" class="sidebar-link">
                            <i class="fas fa-th-large"></i><span>Dashboard</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="#" class="sidebar-link active">
                            <i class="fas fa-plus-circle"></i><span>Create Course</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <div class="content-wrapper">
                
                <div class="breadcrumb-section">
                    <button class="back-btn" id="backBtn">
                        <i class="fas fa-arrow-left"></i><span>Back</span>
                    </button>
                </div>

                <div class="form-container">
                    <h1 class="form-title">Create Course</h1>

                    <form id="createCourseForm" class="module-form">
                        
                        <section class="form-section">
                            <h2 class="section-title">Course Details</h2>
                            
                            <div class="form-group">
                                <label for="courseTitle" class="form-label">Course Title</label>
                                <input type="text" id="courseTitle" class="form-input" placeholder="e.g., Introduction to Computer Science" required>
                            </div>

                            <div class="form-group">
                                <label for="targetAudience" class="form-label">Target Audience</label>
                                <input type="text" id="targetAudience" class="form-input" placeholder="e.g., Beginners, Computer Science Students, Advanced Developers">
                            </div>
                            <div class="form-group">
                                <label for="enrollmentKey" class="form-label">Enrollment Key</label>
                                <input 
                                    type="text" 
                                    id="enrollmentKey" 
                                    class="form-input" 
                                    placeholder="Set a secret key for students to join (e.g., CS101-2026)"
                                    required
                                >
                                <small style="color: var(--text-gray); font-size: 0.8rem;">Students will need this exact code to enroll in your course.</small>
                            </div>
                            <div class="form-group">
                                <label for="courseInfo" class="form-label">Description</label>
                                <textarea id="courseInfo" class="form-textarea" rows="5" placeholder="Enter course description..."></textarea>
                            </div>
                        </section>

                        <section class="form-section">
                            <div class="section-header-with-icon">
                                <div class="section-icon thumbnail-icon"><i class="fas fa-image"></i></div>
                                <h2 class="section-title">Course Thumbnail</h2>
                            </div>

                            <div class="upload-area" id="uploadArea">
                                <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                                <p class="upload-text" id="uploadText">Upload Thumbnail</p>
                                <p class="upload-subtext">PNG, JPG up to 5MB</p>
                                <button type="button" class="upload-btn" id="selectImageBtn">Select Image</button>
                                <input type="file" id="thumbnailInput" accept="image/*" hidden>
                            </div>
                        </section>

                        <div class="form-actions">
                            <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
                            <button type="submit" class="btn-create" id="createBtn">Create Course</button>
                        </div>

                    </form>
                </div>

            </div>
        </main>

    </div>
    <script type="module" src="../../../notifications.js"></script>
    <script type="module" src="create-courses.js"></script>
</body>
</html>

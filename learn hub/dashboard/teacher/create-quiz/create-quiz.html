<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz - UniLearn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="create-quiz.css">
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <a href="../../../index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
                <span>UniLearn</span>
            </a>
            <div class="nav-actions">
                <div class="user-profile" id="userProfile" style="cursor: pointer;">
                    <div class="user-info-header">
                        <div class="user-name-header" id="userName">Loading...</div>
                        <div class="user-role-header" id="userRole">Teacher</div>
                    </div>
                    <div class="user-avatar" id="userAvatar"><span>-</span></div>
                </div>
            </div>
        </div>
    </header>

    <div class="main-layout">
        
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul class="sidebar-menu">
                    <li class="sidebar-item">
                        <a href="../teacher-dashboard/teacher-dashboard.html" class="sidebar-link">
                            <i class="fas fa-th-large"></i><span>Dashboard</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="#" class="sidebar-link active">
                            <i class="fas fa-plus-circle"></i><span>Create Quiz</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <div class="content-wrapper">
                
                <!-- Breadcrumb -->
                <div class="breadcrumb-section">
                    <button class="back-btn" id="backBtn">
                        <i class="fas fa-arrow-left"></i><span>Back</span>
                    </button>
                </div>

                <!-- Quiz Form -->
                <div class="form-container">
                    <h1 class="form-title">Create New Quiz</h1>

                    <form id="createQuizForm">
                        
                        <!-- Quiz Information Section -->
                        <section class="form-section">
                            <h2 class="section-title">Quiz Information</h2>
                            
                            <div class="form-group">
                                <label for="quizTitle" class="form-label">Quiz Title *</label>
                                <input 
                                    type="text" 
                                    id="quizTitle" 
                                    class="form-input" 
                                    placeholder="e.g., Chapter 1 Assessment"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="quizDescription" class="form-label">Description</label>
                                <textarea 
                                    id="quizDescription" 
                                    class="form-textarea" 
                                    rows="3"
                                    placeholder="Describe what this quiz covers..."
                                ></textarea>
                            </div>

                            <div class="form-row">
                                <div class="form-group half-width">
                                    <label for="availableFrom" class="form-label">Available From</label>
                                    <input 
                                        type="datetime-local" 
                                        id="availableFrom" 
                                        class="form-input"
                                    >
                                </div>
                                <div class="form-group half-width">
                                    <label for="availableTo" class="form-label">Available To</label>
                                    <input 
                                        type="datetime-local" 
                                        id="availableTo" 
                                        class="form-input"
                                    >
                                </div>
                            </div>
                        </section>

                        <!-- Quiz Type Selection -->
                        <section class="form-section">
                            <h2 class="section-title">Quiz Type</h2>
                            
                            <div class="quiz-type-selection">
                                <div class="quiz-type-card" id="mcqTypeCard">
                                    <input type="radio" name="quizType" id="mcqType" value="MCQ" checked>
                                    <label for="mcqType">
                                        <div class="type-icon">
                                            <i class="fas fa-list-check"></i>
                                        </div>
                                        <h3>Multiple Choice Questions</h3>
                                        <p>Create questions with multiple answer options</p>
                                    </label>
                                </div>

                                <div class="quiz-type-card" id="fileTypeCard">
                                    <input type="radio" name="quizType" id="fileType" value="FILE">
                                    <label for="fileType">
                                        <div class="type-icon">
                                            <i class="fas fa-file-upload"></i>
                                        </div>
                                        <h3>File Upload Assignment</h3>
                                        <p>Students upload their answers as a file</p>
                                    </label>
                                </div>
                            </div>
                        </section>

                        <!-- MCQ Section -->
                        <section class="form-section" id="mcqSection">
                            <div class="section-header-with-button">
                                <h2 class="section-title">Questions</h2>
                                <button type="button" class="btn-add-question" id="addQuestionBtn">
                                    <i class="fas fa-plus"></i> Add Question
                                </button>
                            </div>

                            <div id="questionsContainer">
                                <!-- Questions will be added here dynamically -->
                            </div>
                        </section>

                        <!-- File Upload Section -->
                        <section class="form-section" id="fileSection" style="display: none;">
                            <h2 class="section-title">Assignment File (Optional)</h2>
                            <p class="section-description">Upload a PDF with instructions or questions that students need to answer</p>
                            
                            <div class="form-group">
                                <label for="assignmentFile" class="form-label">
                                    <i class="fas fa-file-pdf"></i> Upload Assignment PDF
                                </label>
                                <input 
                                    type="file" 
                                    id="assignmentFile" 
                                    class="form-input" 
                                    accept=".pdf"
                                >
                                <small style="color: var(--text-gray);">Students will see this PDF and upload their response</small>
                            </div>
                        </section>

                        <!-- Form Actions -->
                        <div class="form-actions">
                            <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
                            <button type="submit" class="btn-create">
                                <i class="fas fa-check"></i> Create Quiz
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </main>

    </div>

    <script type="module" src="create-quiz.js"></script>
</body>
</html>
